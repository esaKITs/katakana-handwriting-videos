<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>大江静芳先生 カタカナ解説プレビュー（試作）</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#253c47;background:#f8fafb}body{max-width:950px;margin:auto;padding:16px}h1{font-size:1.4rem}p{line-height:1.6}.note{background:#eff4f7;padding:12px;border-radius:8px}#player{width:100%;aspect-ratio:16/9;background:#111;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}button{font:inherit;border:1px solid #c9d5dc;background:white;border-radius:8px;padding:9px;cursor:pointer}button:focus-visible{outline:3px solid #72a4c5}.kana{font-size:1.6rem;min-height:56px}.kana[aria-pressed=true]{background:#27647f;color:white;border-color:#27647f}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{padding:12px}.primary{background:#27647f;color:white;border-color:#27647f}#status{font-weight:600;min-height:1.5em}.small{color:#566d79;font-size:.9rem}@media(max-width:600px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.kana{min-height:53px}}</style></head><body><h1>カタカナの書き方・解説プレビュー</h1><p class="note">大江静芳先生のYouTube動画を文字別に再生する試作です。再生位置はGeminiが字幕から抽出した<strong>暫定時刻</strong>で、映像の開始・終了は未検証です。運筆のみの映像はまだ設定していません。</p><div id="player"></div><p id="status" role="status">動画を読み込んでいます…</p><div class="controls"><button id="play" class="primary">▶ 選んだ文字の解説を再生（音声ON）</button><button id="pause">⏸ 停止</button><button id="loop" aria-pressed="true">ループ：ON</button></div><p id="current" class="small">文字を選択してください。</p><div id="grid" class="grid" aria-label="カタカナ46文字"></div><p class="small">再生時は解説区間の前後に2秒の余裕を設けます。動画の読み込み状況によって、ループ時に一時停止することがあります。</p><p><a href="https://www.youtube.com/watch?v=N_IMNX4BZhU" target="_blank" rel="noopener noreferrer">動画の出典：大江静芳先生（YouTube）</a></p><script>const TIMES={"ア":[50,74],"イ":[75,93],"ウ":[94,127],"エ":[128,162],"オ":[163,196],"カ":[197,222],"キ":[223,256],"ク":[257,293],"ケ":[294,332],"コ":[333,359],"サ":[360,390],"シ":[391,425],"ス":[426,457],"セ":[458,483],"ソ":[484,512],"タ":[513,536],"チ":[537,559],"ツ":[560,591],"テ":[592,609],"ト":[610,641],"ナ":[642,671],"ニ":[672,692],"ヌ":[693,719],"ネ":[720,754],"ノ":[755,768],"ハ":[769,792],"ヒ":[793,810],"フ":[811,829],"ヘ":[830,847],"ホ":[848,884],"マ":[885,909],"ミ":[910,922],"ム":[923,948],"メ":[949,969],"モ":[970,993],"ヤ":[994,1018],"ユ":[1019,1045],"ヨ":[1046,1066],"ラ":[1067,1083],"リ":[1084,1100],"ル":[1101,1125],"レ":[1126,1142],"ロ":[1143,1166],"ワ":[1167,1182],"ヲ":[1228,1244],"ン":[1245,1272]};const VIDEO='N_IMNX4BZhU';const $=id=>document.getElementById(id);let player,ready=false,selected='ア',playing=false,loop=true,busy=false;const status=s=>$('status').textContent=s;const grid=$('grid');for(const kana of Object.keys(TIMES)){const b=document.createElement('button');b.className='kana';b.textContent=kana;b.setAttribute('aria-label',kana+'の解説を再生');b.setAttribute('aria-pressed',String(kana===selected));b.onclick=()=>{selected=kana;update();playSelected()};grid.append(b)}function update(){for(const b of grid.children)b.setAttribute('aria-pressed',String(b.textContent===selected));const [a,z]=TIMES[selected];$('current').textContent=selected+'：字幕による推定区間 '+a+'〜'+z+'秒（前後2秒を追加）'}function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:VIDEO,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;status('準備完了。文字を選ぶと解説を再生します。')},onError:e=>status('YouTube再生エラー：'+e.data)}})}const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);function playSelected(){if(!ready){status('読み込み中です');return}playing=true;busy=false;player.unMute();player.seekTo(Math.max(0,TIMES[selected][0]-2),true);player.playVideo();status(selected+'の解説を再生中（字幕推定）')}function pause(){playing=false;busy=false;if(ready)player.pauseVideo()}$('play').onclick=playSelected;$('pause').onclick=()=>{pause();status('停止しました')};$('loop').onclick=()=>{loop=!loop;$('loop').setAttribute('aria-pressed',String(loop));$('loop').textContent='ループ：'+(loop?'ON':'OFF')};setInterval(()=>{if(!ready||!playing)return;const t=player.getCurrentTime();if(t>=TIMES[selected][1]+2-.08&&!busy){if(!loop){pause();return}busy=true;player.seekTo(Math.max(0,TIMES[selected][0]-2),true);setTimeout(()=>{busy=false},300)}},100);update();</script></body></html>
