name: Build local katakana QR codes
on:
  push:
    branches: [main]
    paths:
      - 'generate_qr.py'
      - 'videos.json'
      - '.github/workflows/build-qr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'qrcode==8.2'
      - run: python generate_qr.py
      - name: Commit generated QR files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr/
          if ! git diff --cached --quiet; then
            git commit -m "Generate 46 local katakana QR SVGs"
            git push
          fi
