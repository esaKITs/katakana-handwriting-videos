<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>カタカナ「サ」ループテスト | esaKITs</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#344d3b;background:#e9eee8}*{box-sizing:border-box}body{margin:0}header{background:#526d59;color:white;padding:22px 16px}main{max-width:680px;margin:20px auto;padding:0 14px}.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 14px #344d3b12}.kana{font-size:65px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.tag{color:#526d59}.video{position:relative;width:100%;aspect-ratio:16/9;background:#344d3b;border-radius:9px;overflow:hidden}.video iframe{width:100%;height:100%}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:8px;background:#526d59;color:white;padding:13px 16px;font-size:15px}button:disabled{opacity:.45}button.secondary{background:#e9eee8;color:#344d3b}.bar{background:#e9eee8;height:5px;border-radius:4px;margin-top:15px}.bar div{height:100%;background:#526d59;width:0}.status{min-height:3em;margin-top:12px}.note{font-size:13px;color:#56695a;line-height:1.7}a{color:#344d3b}footer{margin:22px auto;text-align:center;font-size:12px;line-height:1.8}</style></head>
<body><header><div style="max-width:680px;margin:auto"><small>esaKITs · Katakana Handwriting Videos</small><h1>カタカナの書き方動画</h1></div></header><main><section class="panel"><div class="top"><strong class="kana">サ</strong><span class="tag">06:13–06:25（12秒）</span></div><p>石野華鳳先生の動画で、指定区間の繰り返し再生を試します。</p><div class="video" id="player"></div><div class="buttons"><button id="start" disabled>▶ 再生・ループ開始</button><button id="pause" class="secondary" disabled>一時停止</button><button id="stop" class="secondary" disabled>■ 停止</button></div><div class="bar"><div id="progress"></div></div><p class="status" id="status" role="status" aria-live="polite">プレーヤーを準備しています…</p><p class="note">iPhoneでは再生開始にタップが必要です。YouTube側の制限により、再生やループができない場合があります。</p><p class="note">埋め込みエラーの場合：<a href="https://www.youtube.com/watch?v=Rn2W95wAbvI&t=373s" target="_blank" rel="noopener noreferrer">YouTubeで開始位置を開く ↗</a>（区間ループなし）</p></section><footer>© 2026 Tetsuya Esaki / esaKITs — Enhanced Smart AI Kits<br>動画出典: 石野華鳳先生（YouTube公開動画）</footer></main>
<script>
const VIDEO='Rn2W95wAbvI',START=373,END=385,$=id=>document.getElementById(id);let player,ready=false,loop=false,monitorId,round=0;
function status(s){$('status').textContent=s}
function restart(){if(!loop||!ready)return;round++;try{player.seekTo(START,true);player.playVideo();status('区間ループ再生中（折り返し '+round+' 回）')}catch(e){status('再生位置の変更に失敗しました')}}
function monitor(){clearInterval(monitorId);monitorId=setInterval(()=>{if(!ready)return;try{let t=player.getCurrentTime();$('progress').style.width=Math.max(0,Math.min(100,(t-START)/(END-START)*100))+'%';if(loop&&player.getPlayerState()===YT.PlayerState.PLAYING&&t>=END-.12)restart()}catch(e){}},150)}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:VIDEO,playerVars:{start:START,end:END,playsinline:1,controls:1,rel:0,enablejsapi:1},events:{onReady:()=>{ready=true;['start','pause','stop'].forEach(id=>$(id).disabled=false);status('準備完了。再生ボタンを押してください。');monitor()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&loop)restart()},onError:e=>{loop=false;status('YouTube埋め込みエラー（コード '+e.data+'）。埋め込み制限の可能性があります。')}}})};
$('start').onclick=()=>{if(!ready)return;loop=true;player.seekTo(START,true);player.playVideo();status('06:13〜06:25をループ再生中…')};
$('pause').onclick=()=>{loop=false;player.pauseVideo();status('一時停止しました。')};
$('stop').onclick=()=>{loop=false;player.pauseVideo();player.seekTo(START,true);$('progress').style.width='0%';status('停止しました。')};
let s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>status('YouTube APIの読み込みに失敗しました。');document.head.appendChild(s);
</script></body></html>
