<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>大江静芳先生 カタカナ動画・区間検証（試作）</title>
<style>body{font-family:system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 14px;color:#24333b;line-height:1.6}h1{font-size:1.35rem}.note{background:#f3f5f7;padding:12px;border-radius:8px}#player{width:100%;aspect-ratio:16/9;background:#111}fieldset{margin:14px 0;border:1px solid #cdd5db;border-radius:8px}label{display:inline-flex;gap:5px;align-items:center;margin:6px}input[type=number]{width:95px;font-size:1rem}button{padding:9px 12px;margin:4px;border:1px solid #8799a3;background:#fff;border-radius:6px;cursor:pointer}button:focus-visible{outline:3px solid #4386bb}output{font-variant-numeric:tabular-nums}textarea{width:100%;min-height:120px;box-sizing:border-box}#status{font-weight:600}</style></head>
<body><h1>カタカナ動画・区間検証（作業用）</h1><p class="note">対象：大江静芳先生のYouTube動画。これは測定補助の試作であり、時刻は未実測です。YouTubeのシーク精度・読み込み遅延により、0.1秒指定がフレーム精度を保証するわけではありません。既存教材とは独立しています。</p>
<div id="player"></div><p id="status" role="status">YouTubeプレーヤーを読み込んでいます…</p>
<section style="padding:16px 0"><h2>「ホ」の再生テスト</h2><p>下のどちらかを押すだけです。運筆区間の時刻は仮の値で、実測値ではありません。</p><button id="testWr" style="font-size:1.1rem;padding:15px">運筆のみを再生（音声OFF）</button><button id="testEx" style="font-size:1.1rem;padding:15px">解説付きを再生（音声ON）</button><button id="stop" style="font-size:1.1rem;padding:15px">停止</button><p>運筆のみ：849–861秒 → 870–877秒。解説付き：848–884秒。どちらも未検証の仮時刻です。</p></section><p><a href="https://www.youtube.com/watch?v=N_IMNX4BZhU" target="_blank" rel="noopener noreferrer">元の動画をYouTubeで開く</a></p>
<script>
const ID='N_IMNX4BZhU';let player,ready=false,mode='',index=0;const segments=[[849,861],[870,877]],explanation=[848,884];const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:ID,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;status('準備完了。下の再生ボタンを押してください。')},onError:e=>status('YouTube再生エラー：'+e.data)}})}
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
function stop(){mode='';if(ready)player.pauseVideo()}
function start(which){if(!ready){status('動画の準備ができていません。');return}stop();mode=which;index=0;const range=which==='writing'?segments[0]:explanation;player.seekTo(range[0],true);if(which==='writing')player.mute();else player.unMute();player.playVideo();status(which==='writing'?'運筆のみ再生中（区間の切替を確認してください）':'解説付き再生中')}
$('testWr').onclick=()=>start('writing');$('testEx').onclick=()=>start('explanation');$('stop').onclick=()=>{stop();status('停止しました')};
setInterval(()=>{if(!ready||!mode)return;const t=player.getCurrentTime();const ranges=mode==='writing'?segments:[explanation];const range=ranges[index];if(t>=range[1]-.08){index=(index+1)%ranges.length;player.seekTo(ranges[index][0],true);player.playVideo()}},100);
</script></body></html>
