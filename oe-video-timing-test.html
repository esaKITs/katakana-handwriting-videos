<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>大江静芳先生 カタカナ動画・区間検証（試作）</title>
<style>body{font-family:system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 14px;color:#24333b;line-height:1.6}h1{font-size:1.35rem}.note{background:#f3f5f7;padding:12px;border-radius:8px}#player{width:100%;aspect-ratio:16/9;background:#111}fieldset{margin:14px 0;border:1px solid #cdd5db;border-radius:8px}label{display:inline-flex;gap:5px;align-items:center;margin:6px}input[type=number]{width:95px;font-size:1rem}button{padding:9px 12px;margin:4px;border:1px solid #8799a3;background:#fff;border-radius:6px;cursor:pointer}button:focus-visible{outline:3px solid #4386bb}output{font-variant-numeric:tabular-nums}textarea{width:100%;min-height:120px;box-sizing:border-box}#status{font-weight:600}</style></head>
<body><h1>カタカナ動画・区間検証（作業用）</h1><p class="note">対象：大江静芳先生のYouTube動画。これは測定補助の試作であり、時刻は未実測です。YouTubeのシーク精度・読み込み遅延により、0.1秒指定がフレーム精度を保証するわけではありません。既存教材とは独立しています。</p>
<div id="player"></div><p id="status" role="status">YouTubeプレーヤーを読み込んでいます…</p>
<fieldset><legend>位置を探す</legend><button id="back10">−1秒</button><button id="back1">−0.1秒</button><button id="pause">一時停止</button><button id="forward1">＋0.1秒</button><button id="forward10">＋1秒</button><button id="play">再生</button><p>現在位置（YouTube APIの報告値）：<output id="position">—</output> 秒</p><label>指定位置（秒）<input id="seekValue" type="number" min="0" step="0.1" value="848"></label><button id="seek">指定位置へ移動</button></fieldset>
<fieldset><legend>「ホ」の試験区間（初期値は空欄・実測値ではありません）</legend><p>解説付き：連続区間</p><label>開始 <input id="exStart" type="number" min="0" step="0.1"></label><label>終了 <input id="exEnd" type="number" min="0" step="0.1"></label><button id="captureExStart">現在位置を開始に記録</button><button id="captureExEnd">現在位置を終了に記録</button><button id="testEx">解説付き再生</button>
<p>運筆のみ：区間を追加してつなぐ</p><button id="sample">仮の区間を入力して試す（実測値ではありません）</button><label>開始 <input id="wrStart" type="number" min="0" step="0.1"></label><label>終了 <input id="wrEnd" type="number" min="0" step="0.1"></label><button id="captureWrStart">現在位置を開始に記録</button><button id="captureWrEnd">現在位置を終了に記録</button><button id="add">区間を追加</button><button id="clear">区間を消去</button><p id="segments">登録区間：なし</p><button id="testWr">運筆のみ連続再生</button><button id="stop">停止</button></fieldset>
<fieldset><legend>測定記録</legend><button id="export">JSONを書き出す</button><textarea id="result" readonly aria-label="JSON出力"></textarea></fieldset>
<p><a href="https://www.youtube.com/watch?v=N_IMNX4BZhU" target="_blank" rel="noopener noreferrer">元の動画をYouTubeで開く</a></p>
<script>
const ID='N_IMNX4BZhU';let player,ready=false,mode='',index=0,segments=[];const $=x=>document.getElementById(x);const number=id=>{const s=$(id).value.trim();return s===''?null:Number(s)};const status=s=>$('status').textContent=s;
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:ID,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;status('準備完了。動画を再生して映像を確認してください。')},onError:e=>status('YouTube再生エラー：'+e.data)}})}
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
function current(){return ready?player.getCurrentTime():null}function seek(t){if(!ready||!Number.isFinite(t)||t<0)return;player.seekTo(t,true);$('seekValue').value=t.toFixed(1)}
function record(id){const t=current();if(t!==null)$(id).value=t.toFixed(2)}
function valid(a,b){return a!==null&&b!==null&&Number.isFinite(a)&&Number.isFinite(b)&&a>=0&&b>a}
function show(){ $('segments').textContent=segments.length?'登録区間：'+segments.map(([a,b])=>a+'–'+b+'秒').join(' → '):'登録区間：なし'}
function stop(){mode='';if(ready)player.pauseVideo()}
function start(modeName){if(!ready)return;stop();mode=modeName;index=0;let range=mode==='writing'?segments[0]:[number('exStart'),number('exEnd')];if(!range||!valid(...range)){mode='';status('開始・終了時刻を正しく入力してください。');return}player.seekTo(range[0],true);player.mute();if(mode==='explanation')player.unMute();player.playVideo();status(mode==='writing'?'運筆のみ再生中（区間切替はシーク）':'解説付き再生中')}
$('back10').onclick=()=>seek((current()||0)-1);$('back1').onclick=()=>seek(Math.max(0,(current()||0)-.1));$('forward1').onclick=()=>seek((current()||0)+.1);$('forward10').onclick=()=>seek((current()||0)+1);$('pause').onclick=()=>ready&&player.pauseVideo();$('play').onclick=()=>ready&&player.playVideo();$('seek').onclick=()=>seek(number('seekValue'));$('captureExStart').onclick=()=>record('exStart');$('captureExEnd').onclick=()=>record('exEnd');$('captureWrStart').onclick=()=>record('wrStart');$('captureWrEnd').onclick=()=>record('wrEnd');
$('add').onclick=()=>{const a=number('wrStart'),b=number('wrEnd');if(!valid(a,b)){status('運筆区間の開始・終了を確認してください。');return}segments.push([a,b]);show()};
$('sample').onclick=()=>{stop();$('exStart').value='848';$('exEnd').value='884';segments=[[849,861],[870,877]];show();status('字幕から推定した仮の区間を入力しました。運筆の実測値ではありません。再生のつながりだけを確認してください。')};$('clear').onclick=()=>{stop();segments=[];show()};$('testEx').onclick=()=>start('explanation');$('testWr').onclick=()=>start('writing');$('stop').onclick=stop;
$('export').onclick=()=>{$('result').value=JSON.stringify({videoId:ID,kana:'ホ',explanation:valid(number('exStart'),number('exEnd'))?[number('exStart'),number('exEnd')]:null,writing:segments,verified:false,notes:'利用者による映像確認が必要。YouTube APIの時刻指定はフレーム精度を保証しない。'},null,2)};
setInterval(()=>{if(!ready)return;const t=current();$('position').textContent=t.toFixed(2);if(!mode)return;const ranges=mode==='writing'?segments:[[number('exStart'),number('exEnd')]];const range=ranges[index];if(!range||!valid(...range)){stop();return}if(t>=range[1]-.08){if(mode==='writing'&&index<ranges.length-1){index++;player.seekTo(ranges[index][0],true);player.playVideo()}else{index=0;player.seekTo(ranges[0][0],true);player.playVideo()}}},100);
</script></body></html>
